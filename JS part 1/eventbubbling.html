<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="parent" onclick="alert('Parent clicked')">
    <button id="btn1" onclick="alert('Button 1 clicked')">Button 1 </button>
    <button id="btn2" onclick="alert('Button 2 clicked')">Button 2 </button>
    <button id="btn3" onclick="alert('Button 3 clicked')">Button 3 </button>
</div>
</body>
</html>

<!-- Event bubbling means when an event happens on a child element, the event moves upward through its parent elements.The event starts at the target element and bubbles up to its ancestors. -->
