<body>
   <div id="parent" onclick="handleParent(event)">
    <button id="btn1">Button 1 </button>
    <button id="btn2">Button 2 </button>
    <button id="btn3">Button 3 </button>
</div>


  <script src="eventdelegation.js"></script>

<!-- Event delegation is a technique where we attach one event listener to a parent element instead of adding separate event listeners to each child element. -->

<!-- Event Bubbling
      ↓
Parent receives the event
      ↓
event.target identifies the child -->

<!-- Event delegation is a JavaScript technique where we attach a single event listener to a parent element to handle events from its child elements using event bubbling and event.target. It improves performance and also works well with dynamically created elements. -->
